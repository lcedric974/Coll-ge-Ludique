<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Collège Ludique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b33;--card:#182846;--line:#2a3d62;--txt:#f4f1ea;--mute:#a9b6d3;--ok:#3ddc97;--ko:#ff6b6b;--c:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--ink);color:var(--txt);min-height:100vh;line-height:1.5}
header{max-width:1080px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-weight:800;font-size:1.35rem;cursor:pointer}
.logo span{color:#ffd166}
.score{font-size:.95rem;color:var(--mute)} .score b{color:var(--txt);font-size:1.1rem}
main{max-width:1080px;margin:auto;padding:8px 24px 72px}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;max-width:16ch}
.intro{color:var(--mute);margin:12px 0 24px;max-width:52ch;font-size:1.05rem}
.levels{display:inline-flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap}
.levels button{background:none;border:0;color:var(--mute);padding:10px 20px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}
.levels button.on{background:var(--c);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{position:relative;text-align:left;font:inherit;color:var(--txt);cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 22px 20px;transition:transform .2s,border-color .2s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile:hover{transform:translateY(-3px);border-color:var(--c)}
.tile .ico{font-size:2rem}
.tile h3{font-size:1.25rem;margin:12px 0 2px}
.tile p{color:var(--mute);font-size:.95rem}
.tile .best{margin-top:14px;display:inline-block;font-size:.85rem;background:rgba(255,255,255,.06);padding:4px 10px;border-radius:999px;color:var(--c)}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.btn{background:var(--c);color:var(--ink);border:0;padding:12px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.head{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.head .ico{font-size:2.4rem}
.head h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.chap{color:var(--mute);margin-bottom:22px}
.tabs{display:inline-flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line);margin-bottom:18px;max-width:100%}
.tab{background:none;border:0;color:var(--mute);padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}
.tab.on{background:var(--c);color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,32px)}
.panel h2{color:var(--c);font-size:1.4rem;margin-bottom:12px}
.panel ul{list-style:none;display:grid;gap:10px}
.panel li{padding-left:22px;position:relative;font-size:1.05rem}
.panel li::before{content:"";position:absolute;left:0;top:.6em;width:9px;height:9px;border-radius:3px;background:var(--c)}
.panel li b{color:#fff}
.meta{color:var(--mute);font-size:.95rem;margin-bottom:10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar div{height:100%;background:var(--c);transition:width .35s}
.q{font-size:clamp(1.2rem,3vw,1.5rem);font-weight:700;margin-bottom:20px;line-height:1.25}
.opts{display:grid;gap:10px}
.opt{background:var(--ink);border:1px solid var(--line);color:var(--txt);padding:15px 18px;border-radius:14px;text-align:left;font:inherit;font-size:1.05rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--ok);background:rgba(61,220,151,.14)}
.opt.bad{border-color:var(--ko);background:rgba(255,107,107,.14)}
.exp{margin-top:18px;padding:16px;border-radius:14px;background:var(--ink);border-left:4px solid var(--c);line-height:1.55}
.exp strong{display:block;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.end{text-align:center;padding:14px 0 6px}
.end .big{font-size:clamp(3.5rem,12vw,5.5rem);font-weight:800;color:var(--c);line-height:1}
.end p{color:var(--mute);margin:12px 0 24px;font-size:1.1rem}
.end .row{justify-content:center}
</style>
</head>
<body>
<header>
  <div class="logo" id="home" role="button" tabindex="0">Collège <span>Ludique</span></div>
  <div class="score">Score total <b id="total">0</b></div>
</header>
<main id="app"></main>

<script>
// Programme de 6e : chaque matière contient ses chapitres, chacun avec un cours et des exercices.
window.DATA_6E = [
{id:'maths', ico:'➗', name:'Mathématiques', c:'#ffd166', desc:'Nombres, géométrie et grandeurs.', chapters:[
 {title:'Les nombres décimaux',
  p:['Dans <b>4,57</b>, le 5 est le chiffre des <b>dixièmes</b> et le 7 celui des <b>centièmes</b>.',
     'Pour comparer, on compare la partie entière, puis les dixièmes, puis les centièmes : <b>2,8 > 2,75</b>.',
     'Multiplier par 0,5 revient à prendre la moitié : 12 × 0,5 = 6.'],
  q:[{q:'Quel est le chiffre des dixièmes de 4,57 ?',o:['4','5','7','57'],a:1,e:'Le premier chiffre après la virgule est celui des dixièmes : 5.'},
     {q:'Lequel est le plus grand ?',o:['2,75','2,8','2,075','2,07'],a:1,e:'2,8 = 2,80 et 2,80 > 2,75.'},
     {q:'Combien vaut 12 × 0,5 ?',o:['5','6','12','24'],a:1,e:'Multiplier par 0,5 revient à prendre la moitié : 6.'}]},
 {title:'La symétrie axiale',
  p:['Deux figures sont <b>symétriques par rapport à une droite</b> (l’axe) si l’axe est la médiatrice des segments qui relient leurs points.',
     'Une figure symétrique garde les <b>mêmes longueurs</b> et les mêmes angles que la figure de départ.',
     'Un point situé sur l’axe est son propre symétrique.'],
  q:[{q:'Une figure et sa symétrique ont-elles les mêmes longueurs ?',o:['Oui','Non','Seulement les côtés','Jamais'],a:0,e:'La symétrie axiale conserve les longueurs et les angles.'},
     {q:'Combien d’axes de symétrie possède un carré ?',o:['1','2','4','Aucun'],a:2,e:'Le carré a 4 axes : 2 médiatrices de ses côtés et 2 diagonales.'},
     {q:'Le symétrique d’un point situé sur l’axe est :',o:['Un point différent','Le même point','Le milieu du segment','Hors de la figure'],a:1,e:'Un point sur l’axe est déjà à égale distance de lui-même.'}]},
 {title:'Périmètre et aire',
  p:['Le <b>périmètre</b> est la longueur du contour. Rectangle : P = 2 × (L + l).',
     'L’<b>aire</b> est la surface. Rectangle : A = L × l. Carré de côté c : A = c × c.',
     'Les unités d’aire sont les cm², m², km²… (ce ne sont pas des longueurs).'],
  q:[{q:'Quel est le périmètre d’un rectangle de 5 cm sur 3 cm ?',o:['8 cm','15 cm','16 cm','30 cm'],a:2,e:'P = 2 × (5 + 3) = 16 cm.'},
     {q:'Quelle est l’aire d’un rectangle de 5 cm sur 3 cm ?',o:['8 cm²','15 cm²','16 cm²','30 cm²'],a:1,e:'A = 5 × 3 = 15 cm².'},
     {q:'Quelle est l’aire d’un carré de 4 cm de côté ?',o:['8 cm²','12 cm²','16 cm²','4 cm²'],a:2,e:'A = 4 × 4 = 16 cm².'}]}
]},
{id:'francais', ico:'📚', name:'Français', c:'#ff8fa3', desc:'Groupe nominal, verbes et récit.', chapters:[
 {title:'Le groupe nominal',
  p:['Un <b>groupe nominal</b> est organisé autour d’un nom : <b>déterminant + nom + adjectif</b>.',
     'Le <b>déterminant</b> (le, la, un, ces, mon…) se place devant le nom.',
     'L’<b>adjectif</b> qualifie le nom : « une maison <b>vieille</b> ».'],
  q:[{q:'Dans « la vieille maison », quel est le déterminant ?',o:['vieille','maison','la','vieille maison'],a:2,e:'« La » introduit le nom « maison » : c’est le déterminant.'},
     {q:'Quel est l’adjectif dans « un chien féroce » ?',o:['un','chien','féroce','chien féroce'],a:2,e:'« Féroce » qualifie le nom « chien ».'},
     {q:'Quel est le nom principal de « ces belles fleurs » ?',o:['ces','belles','fleurs','belle'],a:2,e:'Le groupe s’organise autour de « fleurs ».'}]},
 {title:'Le présent de l’indicatif',
  p:['Les verbes du 1er groupe (en -er) ont les terminaisons <b>-e, -es, -e, -ons, -ez, -ent</b> : je chant<b>e</b>, nous chant<b>ons</b>.',
     'Certains verbes sont irréguliers, comme <b>aller</b> : je vais, ils vont.',
     'Au présent, on accorde le verbe avec son sujet.'],
  q:[{q:'Conjuguez « chanter » avec « je » :',o:['je chante','je chantes','je chantons','je chantent'],a:0,e:'Terminaison -e à la 1re personne du singulier.'},
     {q:'Conjuguez « aller » avec « ils » :',o:['ils allent','ils vont','ils vais','ils allons'],a:1,e:'« Aller » est irrégulier : ils vont.'},
     {q:'Conjuguez « finir » avec « nous » :',o:['nous finis','nous finissons','nous finissent','nous finirons'],a:1,e:'Au présent : nous finissons.'}]},
 {title:'Le schéma narratif',
  p:['Un récit suit souvent cinq étapes : <b>situation initiale</b>, <b>élément perturbateur</b>, <b>péripéties</b>, <b>élément de résolution</b>, <b>situation finale</b>.',
     'L’élément perturbateur est ce qui déclenche l’histoire et casse l’équilibre de départ.',
     'Les péripéties sont les événements qui s’enchaînent avant la fin.'],
  q:[{q:'Quelle est la première étape d’un récit ?',o:['La situation finale','La situation initiale','Les péripéties','La résolution'],a:1,e:'La situation initiale présente les personnages et le cadre.'},
     {q:'Ce qui casse l’équilibre de départ est :',o:['La situation finale','L’élément perturbateur','La résolution','Le titre'],a:1,e:'L’élément perturbateur déclenche l’action.'},
     {q:'La dernière étape d’un récit est :',o:['La situation initiale','Le perturbateur','La situation finale','Les péripéties'],a:2,e:'La situation finale termine l’histoire.'}]}
]},
{id:'histoire', ico:'🏛️', name:'Histoire-Géo', c:'#8ecae6', desc:'Préhistoire, Rome et cartes.', chapters:[
 {title:'Rome antique',
  p:['Rome passe d’un régime républicain à l’<b>Empire</b> en 27 av. J.-C., sous <b>Auguste</b>.',
     'La langue officielle de Rome est le <b>latin</b>.',
     'Les Romains appelaient la Méditerranée <b>Mare Nostrum</b>, « notre mer ».'],
  q:[{q:'Quel est le premier empereur romain ?',o:['Jules César','Auguste','Néron','Trajan'],a:1,e:'Auguste est le premier empereur, en 27 av. J.-C.'},
     {q:'Quelle langue parlait-on à Rome ?',o:['Le grec','Le latin','L’italien','Le gaulois'],a:1,e:'Le latin est la langue de Rome.'},
     {q:'Comment les Romains appelaient-ils la Méditerranée ?',o:['Mare Nostrum','Mare Magnum','Terra Nova','Mare Gallicum'],a:0,e:'Mare Nostrum signifie « notre mer ».'}]},
 {title:'La Préhistoire',
  p:['Le <b>Paléolithique</b> est la période des chasseurs-cueilleurs, qui taillent la pierre.',
     'Le <b>Néolithique</b> voit apparaître l’agriculture et l’élevage.',
     'Avec l’agriculture, les hommes deviennent <b>sédentaires</b> et construisent des villages.'],
  q:[{q:'Pendant quelle période apparaît l’agriculture ?',o:['Le Paléolithique','Le Néolithique','L’Antiquité','Le Moyen Âge'],a:1,e:'L’agriculture apparaît au Néolithique.'},
     {q:'Que signifie « sédentaire » ?',o:['Qui voyage sans cesse','Qui vit au même endroit','Qui chasse seulement','Qui vit sous terre'],a:1,e:'Sédentaire : qui s’installe durablement.'},
     {q:'Comment les hommes du Paléolithique fabriquaient-ils leurs outils ?',o:['En bronze','En fer','En taillant la pierre','En plastique'],a:2,e:'Ils taillaient la pierre, comme le silex.'}]},
 {title:'Les cartes et l’échelle',
  p:['L’<b>échelle</b> indique le rapport entre la distance sur la carte et la distance réelle.',
     'À l’échelle 1/100 000, 1 cm sur la carte représente 100 000 cm, soit <b>1 km</b> en réalité.',
     'Sur une carte, le <b>nord</b> est généralement placé en haut.'],
  q:[{q:'À l’échelle 1/100 000, 2 cm sur la carte représentent :',o:['200 m','2 km','20 km','2 m'],a:1,e:'1 cm = 1 km, donc 2 cm = 2 km.'},
     {q:'À l’échelle 1/50 000, 1 cm représente :',o:['50 m','500 m','5 km','1 km'],a:1,e:'1 cm × 50 000 = 50 000 cm = 500 m.'},
     {q:'Sur une carte classique, où se trouve généralement le nord ?',o:['En bas','À gauche','En haut','À droite'],a:2,e:'Le nord est en haut.'}]}
]},
{id:'sciences', ico:'🌱', name:'Sciences', c:'#b8f2a4', desc:'Le vivant, la matière et la lumière.', chapters:[
 {title:'Les besoins du vivant',
  p:['Un être vivant se <b>nourrit</b>, <b>respire</b>, se <b>reproduit</b> et grandit.',
     'Les plantes fabriquent leur nourriture par la <b>photosynthèse</b> : elles absorbent du dioxyde de carbone et de l’eau, et libèrent du dioxygène.',
     'Le <b>milieu de vie</b> fournit l’eau, l’air, la lumière et la nourriture.'],
  q:[{q:'Quel gaz une plante absorbe-t-elle pour la photosynthèse ?',o:['Le dioxygène','Le dioxyde de carbone','L’azote','L’hélium'],a:1,e:'La plante absorbe du CO₂ et rejette du dioxygène.'},
     {q:'Quelle fonction permet à un animal de se procurer de la nourriture ?',o:['La reproduction','La nutrition','La croissance','La respiration'],a:1,e:'La nutrition regroupe la recherche et la digestion des aliments.'},
     {q:'Lequel est un besoin de base d’un être vivant ?',o:['Une voiture','L’eau','Un téléphone','Une montre'],a:1,e:'L’eau est indispensable à tout être vivant.'}]},
 {title:'Mélanges et solutions',
  p:['Dans une <b>solution</b>, le <b>solvant</b> (souvent l’eau) dissout le <b>soluté</b> (le sucre, le sel…).',
     'Un mélange est <b>homogène</b> si on ne voit qu’une seule phase (eau sucrée), <b>hétérogène</b> sinon (sable dans l’eau).',
     'Le soluté ne disparaît pas : on peut le retrouver en évaporant le solvant.'],
  q:[{q:'Dans l’eau sucrée, quel est le soluté ?',o:['L’eau','Le sucre','Le verre','Aucun'],a:1,e:'Le sucre est dissous : c’est le soluté.'},
     {q:'Le mélange sable + eau est :',o:['Homogène','Hétérogène','Une solution','Un gaz'],a:1,e:'On voit distinctement le sable et l’eau : hétérogène.'},
     {q:'Quel est le solvant le plus courant ?',o:['Le sel','L’huile','L’eau','Le sucre'],a:2,e:'L’eau est le solvant le plus courant.'}]},
 {title:'La lumière',
  p:['La lumière se propage en <b>ligne droite</b> dans un milieu transparent et homogène.',
     'Une <b>source</b> de lumière (le Soleil, une lampe) émet sa propre lumière. Un objet <b>éclairé</b> ne fait que la renvoyer.',
     'La lumière voyage beaucoup plus vite que le son.'],
  q:[{q:'Dans quel milieu la lumière se propage-t-elle en ligne droite ?',o:['Dans un milieu transparent et homogène','Dans un brouillard','Dans une pièce noire','Dans un mur opaque'],a:0,e:'Dans un milieu transparent et homogène, elle suit une ligne droite.'},
     {q:'Parmi ces objets, lequel est une source de lumière ?',o:['La Lune','Une table','Le Soleil','Un livre'],a:2,e:'Le Soleil émet sa propre lumière ; la Lune la reçoit et la renvoie.'},
     {q:'La lumière se propage plus vite que le son :',o:['Vrai','Faux'],a:0,e:'La lumière est environ un million de fois plus rapide que le son.'}]}
]}
];

</script>
<script>
// Programme de 5e : chaque matière contient ses chapitres, chacun avec un cours et des exercices.
window.DATA_5E = [
{id:'maths', ico:'➗', name:'Mathématiques', c:'#ffd166', desc:'Fractions, nombres relatifs, angles et proportionnalité.', chapters:[
 {title:'Les fractions',
  p:['Pour additionner des fractions de même dénominateur, on additionne les numérateurs : <b>2/3 + 1/3 = 1</b>.',
     'Pour multiplier : <b>a/b × c/d = ac/bd</b>.',
     'Diviser par une fraction revient à multiplier par son <b>inverse</b> : 1/2 ÷ 1/4 = 2.'],
  q:[{q:'Combien vaut 2/3 + 1/3 ?',o:['3/6','1','2/3','3/3 hors'],a:1,e:'2/3 + 1/3 = 3/3 = 1.'},
     {q:'Combien vaut 3/4 × 2/5 ?',o:['6/20','5/9','3/10','6/9'],a:2,e:'6/20 se simplifie en 3/10.'},
     {q:'Combien vaut 1/2 ÷ 1/4 ?',o:['1/8','2','1/2','4'],a:1,e:'1/2 × 4/1 = 2.'}]},
 {title:'Les nombres relatifs',
  p:['Un <b>nombre relatif</b> est positif (+) ou négatif (−), selon sa position par rapport à zéro.',
     'Addition de deux nombres de signes contraires : on soustrait les distances à zéro et on garde le signe du plus grand. Ex : (−3) + 5 = 2.',
     'Produit : un produit de deux négatifs est positif. Ex : (−4) × (−2) = 8.'],
  q:[{q:'Combien vaut (−3) + 5 ?',o:['−8','−2','2','8'],a:2,e:'Le plus grand en valeur absolue est 5 (positif) : 5 − 3 = 2.'},
     {q:'Combien vaut (−4) × (−2) ?',o:['−8','8','−6','6'],a:1,e:'Un produit de deux négatifs est positif : 8.'},
     {q:'Combien vaut (−6) − (−2) ?',o:['−8','−4','4','8'],a:1,e:'Soustraire −2 revient à ajouter 2 : −6 + 2 = −4.'}]},
 {title:'Les angles',
  p:['Un <b>angle droit</b> mesure 90°, un <b>angle plat</b> mesure 180°.',
     'La somme des angles d’un <b>triangle</b> est toujours égale à <b>180°</b>.',
     'Deux angles sont <b>complémentaires</b> si leur somme vaut 90°.'],
  q:[{q:'Dans un triangle, deux angles mesurent 50° et 60°. Le troisième ?',o:['60°','70°','80°','90°'],a:1,e:'180 − (50 + 60) = 70°.'},
     {q:'Combien mesure un angle plat ?',o:['90°','180°','270°','360°'],a:1,e:'Un angle plat mesure 180°.'},
     {q:'Deux angles complémentaires : l’un mesure 35°. L’autre ?',o:['45°','55°','65°','145°'],a:1,e:'90 − 35 = 55°.'}]},
 {title:'La proportionnalité',
  p:['Deux grandeurs sont <b>proportionnelles</b> si on passe de l’une à l’autre en multipliant toujours par le même nombre (le coefficient).',
     'Ex : 3 kg coûtent 6 €, donc 1 kg coûte 2 €, et 5 kg coûtent 10 €.',
     'Un tableau de proportionnalité se complète en utilisant le coefficient ou le produit en croix.'],
  q:[{q:'3 kg coûtent 6 €. Combien coûtent 4 kg ?',o:['7 €','8 €','9 €','12 €'],a:1,e:'Le prix d’1 kg est 2 €, donc 4 kg coûtent 8 €.'},
     {q:'Une recette pour 4 personnes utilise 200 g de farine. Pour 6 personnes ?',o:['250 g','300 g','400 g','150 g'],a:1,e:'200 × 6/4 = 300 g.'},
     {q:'Les grandeurs suivantes sont-elles proportionnelles ? (2 ; 4) (3 ; 7)',o:['Oui','Non','Peut-être','Impossible à dire'],a:1,e:'4/2 = 2 mais 7/3 n’est pas 2 : elles ne sont pas proportionnelles.'}]}
]},
{id:'francais', ico:'📚', name:'Français', c:'#ff8fa3', desc:'Passé, fonctions et récit.', chapters:[
 {title:'L’imparfait et le passé simple',
  p:['L’<b>imparfait</b> décrit une situation ou une habitude dans le passé : « il pleuvait tous les jours ».',
     'Le <b>passé simple</b> raconte une action ponctuelle et terminée : « il partit au matin ».',
     'Dans un récit, on mêle souvent les deux : l’imparfait pour le décor, le passé simple pour l’action.'],
  q:[{q:'Quel temps est utilisé dans « Il pleuvait tous les jours » ?',o:['Le passé simple','L’imparfait','Le futur','Le présent'],a:1,e:'C’est une habitude répétée dans le passé : imparfait.'},
     {q:'Quel temps est utilisé dans « Il partit au matin » ?',o:['L’imparfait','Le passé composé','Le passé simple','Le conditionnel'],a:2,e:'Action ponctuelle et terminée : passé simple.'},
     {q:'Conjuguez « être » à l’imparfait avec « nous » :',o:['nous sommes','nous étions','nous serons','nous fûmes'],a:1,e:'À l’imparfait : nous étions.'}]},
 {title:'Le complément d’objet',
  p:['Le <b>complément d’objet direct (COD)</b> complète le verbe sans préposition : « Il mange une pomme ».',
     'On le trouve en posant la question « qui ? » ou « quoi ? » après le verbe.',
     'Il peut être remplacé par un pronom : « Il la mange ».'],
  q:[{q:'Dans « Il mange une pomme », quel est le COD ?',o:['Il','mange','une pomme','Aucun'],a:2,e:'On demande « il mange quoi ? » : une pomme.'},

 {title:'Le complément circonstanciel',
  p:['Le <b>complément circonstanciel</b> indique le temps, le lieu, la manière ou la cause : « Hier, il est parti au marché ».',

  q:[{q:'Dans « Hier, il est parti au marché », quel est le complément de temps ?',o:['Hier','il','parti','au marché'],a:0,e:'« Quand ? » : hier.'},

{id:'histoire', ico:'🏰', name:'Histoire-Géo', c:'#8ecae6', desc:'Féodalité, grandes découvertes et Lumières.', chapters:[

 {title:'Les Lumières',

  q:[{q:'Quel philosophe propose la séparation des pouvoirs ?',o:['Voltaire','Montesquieu','Diderot','Rousseau'],a:1,e:'Montesquieu, dans L’Esprit des lois.'},

]},
{id:'sciences', ico:'🫁', name:'Sciences', c:'#b8f2a4', desc:'Digestion, respiration et circulation.', chapters:[

     {q:'Qu’est-ce que la respiration pour les cellules ?',o:['Un moyen de digérer','Un échange de gaz nécessaire à leur fonctionnement','Une manière de bouger','Une façon de dormir'],a:1,e:'Les cellules consomment du dioxygène pour fonctionner.'}]},
 {title:'La circulation sanguine',

     {q:'Combien vaut 10⁴ ?',o:['1 000','10 000','100','40'],a:1,e:'10⁴ = 10 000.'}]},
 {title:'Le théorème de Pythagore',

 {title:'Le théorème de Thalès',
  p:['Si deux droites sécantes sont coupées par deux droites parallèles, les longueurs sont proportionnelles.',
     'Avec M sur [AB] et N sur [AC], si (MN) // (BC) : AM/AB = AN/AC = MN/BC.',

  q:[{q:'Si (MN) est parallèle à (BC), quelle égalité est vraie ?',o:['AM/AB = AN/AC','AM/AN = AB/AC','AM × AB = AN','AB = AC'],a:0,e:'C’est la propriété de Thalès.'},

 {title:'Racines carrées',

  q:[{q:'Combien vaut √49 ?',o:['7','24,5','49','9'],a:0,e:'7 × 7 = 49.'},

     {q:'Une valeur approchée de √50 est :',o:['5','7,07','25','10'],a:1,e:'7,07² ≈ 50.'}]},
 {title:'Fonctions linéaires',
  p:['Une <b>fonction linéaire</b> s’écrit f(x) = a × x, où a est le coefficient.',

  q:[{q:'Si f(x) = 3x, combien vaut f(4) ?',o:['7','12','34','1'],a:1,e:'3 × 4 = 12.'},
     {q:'Quel est le coefficient de f(x) = −2x ?',o:['2','−2','x','0'],a:1,e:'Le coefficient est −2.'},
     {q:'La droite représentant une fonction linéaire passe par :',o:['Le point (1 ; 1)','L’origine du repère','Le point (0 ; 1)','Le point (2 ; 0)'],a:1,e:'f(0) = 0 : elle passe par l’origine.'}]},
 {title:'Statistiques : médiane et étendue',
  p:['La <b>médiane</b> partage la série ordonnée en deux parties de même effectif.',

  q:[{q:'Médiane de 2, 5, 7, 9, 11 :',o:['5','7','9','2'],a:1,e:'La valeur du milieu est 7.'},

     {q:'Étendue de 4, 9, 15, 2 :',o:['13','15','2','6'],a:0,e:'15 − 2 = 13.'}]},
 {title:'Nombres en écriture scientifique',

  q:[{q:'L’écriture scientifique de 3 500 est :',o:['35 × 10²','3,5 × 10³','0,35 × 10⁴','3 500 × 10⁰'],a:1,e:'Le premier facteur doit être entre 1 et 10.'},

 {title:'Équations produits',

 {title:'Fonctions affines',

 {title:'Racines carrées et calculs',

 {title:'Volumes : prisme et cylindre',

]

const $ = s => document.querySelector(s);
const COURSES = {...DATA};
if (window.DATA_6E) COURSES['6e'] = window.DATA_6E;
if (window.DATA_5E) COURSES['5e'] = window.DATA_5E;
if (window.MATHS) for (const lv in window.MATHS) { const m = (COURSES[lv]||[]).find(x => x.id === 'maths'); if (m) m.chapters = window.MATHS[lv]; }
if (window.MATHS_ADD) for (const lv in window.MATHS_ADD) { const m = (COURSES[lv]||[]).find(x => x.id === 'maths'); if (m) { const base = m.chapters || [{title:m.chap.replace('Chapitre : ',''), p:m.p, q:m.q}]; m.chapters = base.concat(window.MATHS_ADD[lv]); } }
const chapters = s => s.chapters || [{title:s.chap.replace('Chapitre : ',''), p:s.p, q:s.q}];
let level = localStorage.getItem('cl_level') || '6e';
let best = JSON.parse(localStorage.getItem('cl_best') || '{}');
let st = {subj:null, ci:0, tab:'cours', i:0, score:0, answered:false};
const cur = () => chapters(st.subj)[st.ci];
const ckey = () => level + '-' + st.subj.id + '-' + st.ci;
const setTitle = t => { document.title = t + ' · Collège Ludique'; };
function updateTotal(){ $('#total').textContent = Object.values(best).reduce((a,b)=>a+b,0); }

function home(){
  st.subj = null;
  document.body.style.setProperty('--c','#ffd166');
  setTitle('Accueil');
  $('#app').innerHTML = `
    <h1>Le collège, en jeu.</h1>
    <p class="intro">Choisis ton niveau, puis une matière et un chapitre : lis le cours, fais les exercices.</p>
    <div class="levels">${LEVELS.map(l => `<button class="${l===level?'on':''}" onclick="setLevel('${l}')">${l}</button>`).join('')}</div>
    <div class="grid">${(COURSES[level]||[]).map(s => `
      <button class="tile" style="--c:${s.c}" onclick="openSubject('${s.id}')">
        <div class="ico">${s.ico}</div>
        <h3>${s.name}</h3>
        <p>${s.desc}</p>
        <span class="best">${chapters(s).length} chapitre${chapters(s).length>1?'s':''}</span>
      </button>`).join('')}
    </div>`;
  updateTotal();
}

function setLevel(l){ level = l; localStorage.setItem('cl_level', l); home(); }

function openSubject(id){
  st.subj = COURSES[level].find(s => s.id === id);
  document.body.style.setProperty('--c', st.subj.c);
  setTitle(st.subj.name + ' ' + level);
  $('#app').innerHTML = `
    <button class="btn ghost" onclick="home()">← Toutes les matières</button>
    <div class="head"><div class="ico">${st.subj.ico}</div><h1>${st.subj.name} · ${level}</h1></div>
    <p class="chap">${st.subj.desc}</p>
    <div class="grid">${chapters(st.subj).map((c,i) => `
      <button class="tile" onclick="openChapter(${i})">
        <h3>${c.title}</h3>
        <span class="best">Meilleur : ${best[level+'-'+st.subj.id+'-'+i] ?? 0}/${c.q.length}</span>
      </button>`).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function openChapter(i){ st.ci = i; st.tab = 'cours'; chapterPage(); window.scrollTo(0,0); }

function chapterPage(){
  const c = cur();
  setTitle(c.title);
  $('#app').innerHTML = `
    <button class="btn ghost" onclick="openSubject('${st.subj.id}')">← ${st.subj.name}</button>
    <div class="head"><div class="ico">${st.subj.ico}</div><h1>${c.title}</h1></div>
    <p class="chap">${st.subj.name} · ${level}</p>
    <div class="tabs">
      <button class="tab ${st.tab==='cours'?'on':''}" onclick="setTab('cours')">📖 Cours</button>
      <button class="tab ${st.tab==='quiz'?'on':''}" onclick="setTab('quiz')">✏️ Exercices</button>
    </div>
    <div class="panel" id="content"></div>`;
  st.tab === 'cours' ? showLesson() : startQuiz();
}

function setTab(t){ st.tab = t; chapterPage(); window.scrollTo(0,0); }

function showLesson(){
  $('#content').innerHTML = `<ul>${cur().p.map(x => `<li>${x}</li>`).join('')}</ul>
    <div class="row"><span></span><button class="btn" onclick="setTab('quiz')">Faire les exercices →</button></div>`;
}

function startQuiz(){ st.i = 0; st.score = 0; st.answered = false; quizStep(); }

function quizStep(){
  const q = cur().q, n = q.length;
  if (st.i >= n) return endQuiz();
  const x = q[st.i];
  $('#content').innerHTML = `
    <div class="meta">Exercice ${st.i+1} sur ${n} · ${st.score} bonne${st.score>1?'s':''} réponse${st.score>1?'s':''}</div>
    <div class="bar"><div style="width:${(st.i/n)*100}%"></div></div>
    <div class="q">${x.q}</div>
    <div class="opts">${x.o.map((o,k) => `<button class="opt" onclick="answer(${k})">${o}</button>`).join('')}</div>
    <div id="fb"></div>`;
}

function answer(k){
  if (st.answered) return;
  st.answered = true;
  const q = cur().q, x = q[st.i];
  document.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if (j === x.a) b.classList.add('good');
    else if (j === k) b.classList.add('bad');
  });
  if (k === x.a) st.score++;
  const last = st.i + 1 >= q.length;
  $('#fb').innerHTML = `
    <div class="exp"><strong>${k===x.a ? '✅ Bravo !' : '❌ Pas tout à fait.'}</strong>${x.e}</div>
    <div class="row"><span></span><button class="btn" onclick="nextQ()">${last ? 'Voir mon score' : 'Exercice suivant →'}</button></div>`;
}

function nextQ(){ st.i++; st.answered = false; quizStep(); }

function endQuiz(){
  const n = cur().q.length, p = st.score;
  if (p > (best[ckey()] ?? 0)) {
    best[ckey()] = p;
    localStorage.setItem('cl_best', JSON.stringify(best));
  }
  const msg = p === n ? 'Parfait, tu maîtrises ce chapitre ! 🌟'
            : p >= n/2 ? 'Bien joué ! Relis le cours pour viser le sans-faute. 👏'
            : 'Pas grave, relis le cours et retente ta chance. 💪';
  $('#content').innerHTML = `
    <div class="end">
      <div class="meta">Exercices terminés</div>
      <div class="big">${p}/${n}</div>
      <p>${msg}</p>
      <div class="row">
        <button class="btn" onclick="startQuiz()">Recommencer</button>
        <button class="btn ghost" onclick="setTab('cours')">Revoir le cours</button>
        <button class="btn ghost" onclick="openSubject('${st.subj.id}')">Autres chapitres</button>
      </div>
    </div>`;
  updateTotal();
}

$('#home').addEventListener('click', home);
$('#home').addEventListener('keydown', e => { if (e.key === 'Enter') home(); });
home();
</script>

</html>
